<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obituary Checker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D0C18;
      --surface: rgba(255,255,255,0.06);
      --surface-hover: rgba(255,255,255,0.10);
      --card-bg: #1C1B2E;
      --card-shadow: 0 4px 24px rgba(0,0,0,0.55);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #E8E6F2;
      --text-muted: rgba(232,230,242,0.65);
      --text-dim: rgba(232,230,242,0.38);
      --radius: 14px;
      --radius-sm: 8px;
      --green: #34D399;
      --green-bg: rgba(52,211,153,0.12);
      --green-border: rgba(52,211,153,0.25);
      --orange: #FB923C;
      --orange-bg: rgba(251,146,60,0.12);
      --orange-border: rgba(251,146,60,0.30);
      --red: #F87171;
      --red-bg: rgba(248,113,113,0.12);
      --red-border: rgba(248,113,113,0.30);
      --akard: #34D399;
      --akard-bg: rgba(52,211,153,0.14);
      --akard-border: rgba(52,211,153,0.34);
      --oc: #F87171;
      --oc-bg: rgba(248,113,113,0.14);
      --oc-border: rgba(248,113,113,0.34);
      --oh: #60A5FA;
      --oh-bg: rgba(96,165,250,0.14);
      --oh-border: rgba(96,165,250,0.34);
      --blue: #60A5FA;
      --teal: #2DD4BF;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F0EEF8;
        --surface: rgba(0,0,0,0.04);
        --surface-hover: rgba(0,0,0,0.07);
        --card-bg: #FFFFFF;
        --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
        --border: rgba(0,0,0,0.08);
        --border-hover: rgba(0,0,0,0.18);
        --text: #1C1B2E;
        --text-muted: rgba(28,27,46,0.68);
        --text-dim: rgba(28,27,46,0.42);
        --green-bg: rgba(5,150,105,0.08);
        --green-border: rgba(5,150,105,0.20);
        --orange-bg: rgba(234,88,12,0.08);
        --orange-border: rgba(234,88,12,0.22);
        --red-bg: rgba(220,38,38,0.08);
        --red-border: rgba(220,38,38,0.22);
        --blue: #2563EB;
        --teal: #0D9488;
        --red: #DC2626;
        --akard: #059669;
        --akard-bg: rgba(5,150,105,0.10);
        --akard-border: rgba(5,150,105,0.26);
        --oc: #DC2626;
        --oc-bg: rgba(220,38,38,0.10);
        --oc-border: rgba(220,38,38,0.26);
        --oh: #2563EB;
        --oh-bg: rgba(37,99,235,0.10);
        --oh-border: rgba(37,99,235,0.26);
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 24px 20px;
    }

    header {
      max-width: 1160px; margin: 0 auto 24px;
      display: flex; align-items: baseline; gap: 12px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
    #last-updated { font-size: 0.8rem; color: var(--text-dim); }

    /* ── Page layout ─────────────────────────────────────────────────────── */

    /* Mobile: calendar top, then panels stacked */
    .page-grid {
      max-width: 1160px; margin: 0 auto;
      display: grid; gap: 20px;
      grid-template-columns: 1fr;
      grid-template-areas: "cal" "oc" "ak" "oh";
    }

    /* Tablet: calendar spans top, panels side-by-side */
    @media (min-width: 641px) {
      .page-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-areas: "cal cal" "oc ak" "oh oh";
      }
    }

    /* Large tablet: three funeral home panels below calendar */
    @media (min-width: 1000px) {
      .page-grid {
        max-width: 1460px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-areas: "cal cal cal" "oc ak oh";
      }
    }

    /* Desktop: panels + sticky calendar sidebar */
    @media (min-width: 1240px) {
      .page-grid {
        grid-template-columns: 1fr 1fr 1fr 240px;
        grid-template-areas: "oc ak oh cal";
      }
      .cal-sidebar {
        position: sticky;
        top: 24px;
        align-self: start;
      }
    }

    .oc-panel  { grid-area: oc; }
    .ak-panel  { grid-area: ak; }
    .oh-panel  { grid-area: oh; }
    .cal-sidebar { grid-area: cal; }

    /* ── Panel card ──────────────────────────────────────────────────────── */

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-top-width: 3px;
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }
    .panel-oc { border-top-color: var(--oc); }
    .panel-ak { border-top-color: var(--akard); }
    .panel-oh { border-top-color: var(--oh); }

    .panel-header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }

    .fh-logo {
      width: 36px; height: 36px; border-radius: 6px;
      object-fit: contain; flex-shrink: 0;
      background: white; padding: 3px;
    }

    .panel-title-group { flex: 1; min-width: 0; }

    .panel-title-link {
      font-size: 1rem; font-weight: 600; color: var(--text);
      text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .panel-oc .panel-title-link { color: var(--oc); }
    .panel-ak .panel-title-link { color: var(--akard); }
    .panel-oh .panel-title-link { color: var(--oh); }
    .panel-title-link:hover { text-decoration: underline; text-underline-offset: 3px; }

    .summary-badge {
      font-size: 0.75rem; font-weight: 600;
      padding: 4px 10px; border-radius: 20px; flex-shrink: 0;
    }
    .summary-badge.ak.clean,
    .summary-badge.ak.alert  { background: var(--akard-bg); color: var(--akard); border: 1px solid var(--akard-border); }
    .summary-badge.oc.clean,
    .summary-badge.oc.alert  { background: var(--oc-bg); color: var(--oc); border: 1px solid var(--oc-border); }
    .summary-badge.oh.clean,
    .summary-badge.oh.alert  { background: var(--oh-bg); color: var(--oh); border: 1px solid var(--oh-border); }
    .summary-badge.loading { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }

    /* Mobile panel collapse */
    .panel-chevron {
      display: none; font-size: 1rem; color: var(--text-dim);
      margin-left: 4px; flex-shrink: 0; transition: transform 0.2s;
    }
    @media (max-width: 640px) {
      .panel-header { cursor: pointer; user-select: none; }
      .panel-chevron { display: block; }
      .panel-body { display: none; }
      .panel.expanded .panel-body { display: block; }
      .panel.expanded .panel-chevron { transform: rotate(180deg); }
    }

    /* ── Section labels ──────────────────────────────────────────────────── */

    .week-section-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; padding: 10px 14px 3px;
    }
    .panel-oc .week-section-label { color: var(--oc); }
    .panel-ak .week-section-label { color: var(--akard); }
    .panel-oh .week-section-label { color: var(--oh); }
    .older-section-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--text-dim); padding: 10px 14px 3px;
    }

    /* ── Obit card ───────────────────────────────────────────────────────── */

    .obit-list { padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 8px; }

    .obit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .obit-card:hover { border-color: var(--border-hover); }
    .panel-oc .obit-card.recent { background: var(--oc-bg); border-color: var(--oc-border); }
    .panel-ak .obit-card.recent { background: var(--akard-bg); border-color: var(--akard-border); }
    .panel-oh .obit-card.recent { background: var(--oh-bg); border-color: var(--oh-border); }

    .obit-top-link {
      display: block; text-decoration: none; color: inherit;
      padding: 11px 12px 0;
    }
    .obit-top-link:hover .obit-name { text-decoration: underline; text-underline-offset: 2px; }

    .obit-header { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }

    .obit-photo {
      width: 44px; height: 56px; object-fit: cover;
      border-radius: 4px; flex-shrink: 0; background: var(--surface);
    }

    .obit-info { flex: 1; min-width: 0; padding-top: 1px; }
    .obit-name { font-size: 0.88rem; font-weight: 700; margin-bottom: 3px; }
    .obit-meta { font-size: 0.72rem; color: var(--text-dim); line-height: 1.5; }

    /* ── Service details table ────────────────────────────────────────────── */

    .svc-table {
      width: 100%; border-collapse: collapse; font-size: 0.74rem;
    }
    .svc-table thead th {
      text-align: left; font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--text-dim); padding: 0 8px 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .svc-table tbody tr { border-top: 1px solid var(--border); }
    .svc-table tbody tr:first-child { border-top: none; }
    .svc-table td { padding: 5px 8px 5px 0; vertical-align: top; line-height: 1.4; }
    .svc-event { width: 26%; min-width: 92px; }
    .svc-date-col { width: 28%; min-width: 110px; }
    .svc-location-col { width: 46%; }
    .svc-type  { font-weight: 600; color: var(--text); }
    .svc-event-time { color: var(--text-muted); margin-top: 1px; }
    .svc-date  { color: var(--text); }
    .svc-loc   { color: var(--text); }
    .svc-loc-ak { color: var(--akard); font-weight: 600; }
    .svc-loc-oc { color: var(--oc); font-weight: 600; }
    .svc-loc-oh { color: var(--oh); font-weight: 600; }

    /* ── Collapsible sections (shared) ───────────────────────────────────── */

    .obit-detail {
      border-top: 1px solid var(--border); padding: 0 12px 10px;
    }
    .obit-detail-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text-dim);
      padding: 8px 0 0;
    }
    .obit-detail summary {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text-dim);
      cursor: pointer; user-select: none; padding: 8px 0 0;
      list-style: none; display: flex; align-items: center; gap: 4px;
    }
    .obit-detail summary::-webkit-details-marker { display: none; }
    .obit-detail summary::after { content: '▾'; }
    .obit-detail[open] summary::after { content: '▴'; }
    .obit-detail-body { margin-top: 8px; }

    .obit-full-text {
      font-size: 0.75rem; color: var(--text-muted);
      line-height: 1.65; white-space: pre-wrap;
    }
    .svc-detail-loading { font-size: 0.75rem; color: var(--text-dim); font-style: italic; }
    .svc-detail-error   { font-size: 0.75rem; color: var(--red); }

    .no-services { font-size: 0.75rem; color: var(--text-dim); font-style: italic; padding: 0 12px 10px; }
    .empty-state  { padding: 32px 18px; text-align: center; color: var(--text-dim); font-size: 0.85rem; }
    .error-state  { padding: 20px 18px; font-size: 0.82rem; color: var(--red); }
    .loading-state { padding: 32px 18px; text-align: center; color: var(--text-dim); font-size: 0.85rem; }

    /* ── Calendar widget ─────────────────────────────────────────────────── */

    .cal-widget {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      overflow: hidden;
    }

    .cal-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }

    .cal-month-label { font-size: 0.88rem; font-weight: 600; }

    .cal-nav {
      background: none; border: none;
      color: var(--text-muted); font-size: 1.1rem;
      cursor: pointer; padding: 0 4px; line-height: 1;
    }
    .cal-nav:hover { color: var(--text); }

    .cal-dow-row {
      display: grid; grid-template-columns: repeat(7, 1fr);
      padding: 8px 10px 2px; gap: 2px;
    }
    .cal-dow-row span {
      text-align: center; font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-dim);
    }
    .cal-dow-row .wd-end { color: var(--red); opacity: 0.75; }

    .cal-days {
      display: grid; grid-template-columns: repeat(7, 1fr);
      padding: 2px 10px 12px; gap: 1px;
    }

    .cal-day {
      position: relative; text-align: center;
      font-size: 0.78rem; padding: 5px 2px 4px;
      border-radius: 5px; color: var(--text); line-height: 1;
      cursor: default;
      min-height: 30px;
    }
    .cal-day-num { display: block; }
    .cal-day-other  { color: var(--text-dim); }
    .cal-day-weekend { color: var(--red); }
    .cal-day-other.cal-day-weekend { color: var(--red); opacity: 0.4; }

    .cal-day-today {
      background: rgba(255,255,255,0.12);
      font-weight: 700;
    }
    @media (prefers-color-scheme: light) {
      .cal-day-today { background: rgba(0,0,0,0.08); }
    }

    .cal-dots {
      display: flex; justify-content: center; gap: 3px;
      margin-top: 3px; min-height: 4px;
    }
    .cal-dot {
      width: 4px; height: 4px; border-radius: 50%;
      display: inline-block;
    }
    .cal-dot.ak { background: var(--akard); }
    .cal-dot.oc { background: var(--oc); }
    .cal-dot.oh { background: var(--oh); }
  </style>
</head>
<body>

<header>
  <h1>Obituary Checker</h1>
  <span id="last-updated"></span>
</header>

<div class="page-grid">

  <!-- ── Oakley-Cook panel ──────────────────────────────────────────────── -->
  <div class="panel oc-panel panel-oc">
    <div class="panel-header">
      <img class="fh-logo" src="https://d1q40j6jx1d8h6.cloudfront.net/SiteBuilder/ac386460-9069-4d71-8a48-0a6ab1f5f511/562b11ff-74cb-4d66-b951-c27101f19437_thumbnail.webp" alt="Oakley-Cook logo">
      <div class="panel-title-group">
        <a class="panel-title-link" href="https://www.oakley-cook.com/obituaries/obituary-listings?page=1" target="_blank" rel="noopener">Oakley-Cook</a>
      </div>
      <span class="summary-badge loading" id="oc-badge">Loading...</span>
      <span class="panel-chevron">▾</span>
    </div>
    <div class="panel-body">
      <div id="oc-body"><div class="loading-state">Loading...</div></div>
    </div>
  </div>

  <!-- ── Akard panel ────────────────────────────────────────────────────── -->
  <div class="panel ak-panel panel-ak">
    <div class="panel-header">
      <img class="fh-logo" src="https://d1q40j6jx1d8h6.cloudfront.net/SiteBuilder/67518621-83f9-4a0d-aa33-7b11c4c73ce9/068b181f-349e-43a2-8451-f771d5b2d275_thumbnail.webp" alt="Akard logo">
      <div class="panel-title-group">
        <a class="panel-title-link" href="https://www.akardfuneralhome.com/obituaries/obituary-listings?page=1" target="_blank" rel="noopener">Akard</a>
      </div>
      <span class="summary-badge loading" id="ak-badge">Loading...</span>
      <span class="panel-chevron">▾</span>
    </div>
    <div class="panel-body">
      <div id="ak-body"><div class="loading-state">Loading...</div></div>
    </div>
  </div>

  <!-- ── Oak Hill panel ──────────────────────────────────────────────────── -->
  <div class="panel oh-panel panel-oh">
    <div class="panel-header">
      <img class="fh-logo" src="https://d1q40j6jx1d8h6.cloudfront.net/SiteBuilder/71db2950-dc10-4a1b-8c2c-98d8a6ad0a03/8fd65127-a741-4669-b196-574e81a3f910_thumbnail.webp" alt="Oak Hill logo">
      <div class="panel-title-group">
        <a class="panel-title-link" href="https://www.oakhillfh.com/obituaries/obituary-listings" target="_blank" rel="noopener">Oak Hill</a>
      </div>
      <span class="summary-badge loading" id="oh-badge">Loading...</span>
      <span class="panel-chevron">▾</span>
    </div>
    <div class="panel-body">
      <div id="oh-body"><div class="loading-state">Loading...</div></div>
    </div>
  </div>

  <!-- ── Calendar sidebar ───────────────────────────────────────────────── -->
  <div class="cal-sidebar">
    <div class="cal-widget">
      <div class="cal-header">
        <button class="cal-nav" id="cal-prev" aria-label="Previous month">&#8249;</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button class="cal-nav" id="cal-next" aria-label="Next month">&#8250;</button>
      </div>
      <div class="cal-dow-row">
        <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span>
        <span class="wd-end">Sa</span><span class="wd-end">Su</span>
      </div>
      <div class="cal-days" id="cal-days"></div>
    </div>
  </div>

</div><!-- .page-grid -->

<script>
  const LOOKBACK_DAYS = 30;
  const RECENT_DAYS  = 7;
  const IMG_BASE     = 'https://d1q40j6jx1d8h6.cloudfront.net/';
  const obituaryInfoCache = new Map();

  // ── Helpers ───────────────────────────────────────────────────────────────

  function parseDate(str) {
    if (!str) return null;
    const d = new Date(str);
    return isNaN(d.getTime()) ? null : d;
  }
  function fmt(date) {
    if (!date) return '';
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function calcAge(b, d) {
    const born = parseDate(b), died = parseDate(d);
    if (!born || !died) return null;
    let age = died.getFullYear() - born.getFullYear();
    const m = died.getMonth() - born.getMonth();
    if (m < 0 || (m === 0 && died.getDate() < born.getDate())) age--;
    return age >= 0 ? age : null;
  }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function isRecent(date, now) {
    if (!date) return false;
    const d = daysBetween(date, now);
    return d >= 0 && d <= RECENT_DAYS;
  }
  function isWithinLookback(date, now) {
    if (!date) return false;
    const d = daysBetween(date, now);
    return d >= 0 && d <= LOOKBACK_DAYS;
  }
  function isoDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function escHtml(str) {
    return String(str || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Calendar ──────────────────────────────────────────────────────────────

  const calState = {
    year:  new Date().getFullYear(),
    month: new Date().getMonth(),   // 0-indexed
    serviceDates: {
      akard: new Set(),
      'oakley-cook': new Set(),
      'oak-hill': new Set(),
    },
  };

  function addServiceDate(src, date) {
    if (!date || !calState.serviceDates[src]) return;
    calState.serviceDates[src].add(isoDate(date));
  }

  function normalizeLocationName(name) {
    return String(name || '').toLowerCase().replace(/[^a-z]/g, '');
  }

  function isSourceLocation(src, name) {
    const normalized = normalizeLocationName(name);
    if (!normalized) return false;
    if (src === 'akard') return normalized.includes('akard');
    if (src === 'oakley-cook') return normalized.includes('oakleycook');
    if (src === 'oak-hill') return normalized.includes('oakhillfuneral');
    return false;
  }

  function locationToneClass(src, name) {
    if (!isSourceLocation(src, name)) return '';
    if (src === 'akard') return 'svc-loc-ak';
    if (src === 'oakley-cook') return 'svc-loc-oc';
    if (src === 'oak-hill') return 'svc-loc-oh';
    return '';
  }

  function isCleaningRelevantEvent(name) {
    return /service|visitation/i.test(String(name || ''));
  }

  function sourceTone(src) {
    if (src === 'akard') return 'ak';
    if (src === 'oakley-cook') return 'oc';
    if (src === 'oak-hill') return 'oh';
    return '';
  }

  function addServiceDates(src, services) {
    for (const svc of services || []) {
      if (!isSourceLocation(src, svc?.ServiceLocation?.Name)) continue;
      const d = parseDate(svc.StartTime);
      if (d) addServiceDate(src, d);
    }
    renderCalendar();
  }

  function renderCalendar() {
    const { year, month, serviceDates } = calState;
    const today = new Date();

    document.getElementById('cal-month-label').textContent =
      new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    const firstDow  = new Date(year, month, 1).getDay();          // Sun=0
    const startSlot = firstDow === 0 ? 6 : firstDow - 1;         // Mon=0 offset
    const lastDate  = new Date(year, month + 1, 0).getDate();
    const prevLast  = new Date(year, month, 0).getDate();

    const cells = [];

    // Prev-month tail
    for (let i = startSlot - 1; i >= 0; i--) {
      const m = month === 0 ? 11 : month - 1;
      const y = month === 0 ? year - 1 : year;
      cells.push({ day: prevLast - i, month: m, year: y, current: false });
    }
    // Current month
    for (let d = 1; d <= lastDate; d++) {
      cells.push({ day: d, month, year, current: true });
    }
    // Next-month fill to complete last row
    let nd = 1;
    while (cells.length % 7 !== 0) {
      const m = month === 11 ? 0 : month + 1;
      const y = month === 11 ? year + 1 : year;
      cells.push({ day: nd++, month: m, year: y, current: false });
    }

    const html = cells.map(({ day, month: m, year: y, current }) => {
      const date   = new Date(y, m, day);
      const dow    = date.getDay();                     // 0=Sun, 6=Sat
      const wkend  = dow === 0 || dow === 6;
      const isToday= y === today.getFullYear() && m === today.getMonth() && day === today.getDate();
      const key    = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const hasAk  = serviceDates.akard.has(key);
      const hasOc  = serviceDates['oakley-cook'].has(key);
      const hasOh  = serviceDates['oak-hill'].has(key);

      let cls = 'cal-day';
      if (!current) cls += ' cal-day-other';
      if (wkend)    cls += ' cal-day-weekend';
      if (isToday)  cls += ' cal-day-today';
      const serviceLabels = [
        hasAk ? 'Akard' : '',
        hasOc ? 'Oakley-Cook' : '',
        hasOh ? 'Oak Hill' : '',
      ].filter(Boolean);
      const dotTitle = serviceLabels.length ? `${serviceLabels.join(', ')} service day` : '';
      const dots = serviceLabels.length
        ? `<div class="cal-dots">${hasAk ? '<span class="cal-dot ak"></span>' : ''}${hasOc ? '<span class="cal-dot oc"></span>' : ''}${hasOh ? '<span class="cal-dot oh"></span>' : ''}</div>`
        : '<div class="cal-dots"></div>';

      return `<div class="${cls}" title="${dotTitle}"><span class="cal-day-num">${day}</span>${dots}</div>`;
    }).join('');

    document.getElementById('cal-days').innerHTML = html;
  }

  document.getElementById('cal-prev').addEventListener('click', () => {
    if (calState.month === 0) { calState.month = 11; calState.year--; }
    else calState.month--;
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    if (calState.month === 11) { calState.month = 0; calState.year++; }
    else calState.month++;
    renderCalendar();
  });

  renderCalendar(); // render immediately before API data arrives

  // ── Service details (loaded from GetObituaryInfo API) ─────────────────────

  function fmtIsoTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function fmtIsoDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  async function getObituaryInfo(obituaryId, src) {
    const key = `${src}:${obituaryId}`;
    if (!obituaryInfoCache.has(key)) {
      obituaryInfoCache.set(key, (async () => {
        const res = await fetch(`/api/obituary-info?obituaryId=${encodeURIComponent(obituaryId)}&src=${encodeURIComponent(src)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })());
    }
    return obituaryInfoCache.get(key);
  }

  function buildObituaryMeta(src, info) {
    const services = Array.isArray(info?.services) ? info.services : [];
    const sourceServices = services.filter(svc => isSourceLocation(src, svc?.ServiceLocation?.Name));
    const priorityServices = sourceServices.filter(svc => isCleaningRelevantEvent(svc?.ServiceEventName));
    return {
      services,
      cemetery: info?.cemetery ?? null,
      sourceServices,
      priorityServices,
    };
  }

  function renderServiceTable(services, cemetery, src) {
    const rows = services.map(svc => {
      const name  = escHtml(svc.ServiceEventName || '');
      const date  = escHtml(fmtIsoDate(svc.StartTime));
      const start = fmtIsoTime(svc.StartTime);
      const end   = fmtIsoTime(svc.EndTime);
      const time  = escHtml(start && end ? `${start} to ${end}` : start);
      const loc   = svc.ServiceLocation || {};
      const locName = escHtml(loc.Name || '');
      const locTone = locationToneClass(src, loc.Name);
      return `<tr>
        <td class="svc-event">
          <div class="svc-type">${name}</div>
          <div class="svc-event-time">${time}</div>
        </td>
        <td class="svc-date svc-date-col">${date}</td>
        <td class="svc-loc svc-location-col${locTone ? ` ${locTone}` : ''}">${locName}</td>
      </tr>`;
    });

    if (cemetery) {
      const locTone = locationToneClass(src, cemetery.Name);
      rows.push(`<tr>
        <td class="svc-event">
          <div class="svc-type">Final Resting Place</div>
        </td>
        <td class="svc-date svc-date-col"></td>
        <td class="svc-loc svc-location-col${locTone ? ` ${locTone}` : ''}">${escHtml(cemetery.Name || '')}</td>
      </tr>`);
    }

    if (!rows.length) return '<div class="svc-detail-error">No service events found.</div>';

    return `<table class="svc-table">
      <thead><tr><th>Event</th><th>Date</th><th>Location</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>`;
  }

  function attachServiceDetails(bodyEl, src, metaById) {
    bodyEl.querySelectorAll('.svc-detail-body[data-ob-id]').forEach(async body => {
      const obId = body.dataset.obId;
      body.innerHTML = '<div class="svc-detail-loading">Loading...</div>';
      try {
        const meta = metaById.get(String(obId)) || buildObituaryMeta(src, await getObituaryInfo(obId, src));
        addServiceDates(src, meta.services);
        body.innerHTML = renderServiceTable(meta.services, meta.cemetery, src);
      } catch (err) {
        body.innerHTML = `<div class="svc-detail-error">Could not load: ${escHtml(err.message)}</div>`;
      }
    });
  }

  // ── Card / panel rendering ────────────────────────────────────────────────

  function obituaryUrl(obit, baseUrl) {
    const name = (obit.FullName || `${obit.FirstName || ''} ${obit.LastName || ''}`)
      .trim().replace(/\s+/g, '-');
    return `${baseUrl}${name}?obId=${obit.Id}`;
  }

  function thumbnailUrl(obit) {
    if (!obit.ThumbnailUrl) return null;
    return IMG_BASE + obit.ThumbnailUrl.replace(/\.jpg$/i, '.webp');
  }

  function descriptionToText(html) {
    if (!html) return '';
    const doc = new DOMParser().parseFromString(html, 'text/html');
    return Array.from(doc.querySelectorAll('p'))
      .map(p => p.textContent.trim()).filter(t => t.length > 0).join('\n\n');
  }

  function renderCard(obit, highlight, baseUrl) {
    const death     = parseDate(obit.DeathDate);
    const age       = calcAge(obit.BirthDate, obit.DeathDate);
    const thumb     = thumbnailUrl(obit);
    const url       = baseUrl ? obituaryUrl(obit, baseUrl) : (obit.StoreUrl || '#');

    const metaParts = [];
    if (death) metaParts.push(`Died ${fmt(death)}`);
    if (age != null) metaParts.push(`Age ${age}`);
    if (obit.PlaceOfResidence) metaParts.push(escHtml(obit.PlaceOfResidence));

    const photoHtml = thumb
      ? `<img class="obit-photo" src="${escHtml(thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : '';

    const detailSection = `<div class="obit-detail">
      <div class="obit-detail-label">Service Details</div>
      <div class="obit-detail-body svc-detail-body" data-ob-id="${escHtml(String(obit.Id))}"></div>
    </div>`;

    // Full Obituary collapsible
    const fullText = descriptionToText(obit.Description);
    const fullSection = fullText
      ? `<details class="obit-detail">
          <summary>Full Obituary</summary>
          <div class="obit-detail-body obit-full-text">${escHtml(fullText)}</div>
        </details>`
      : '';

    const name = escHtml(obit.FullName || `${obit.FirstName || ''} ${obit.LastName || ''}`.trim());

    return `<div class="obit-card${highlight ? ' recent' : ''}">
      <a class="obit-top-link" href="${escHtml(url)}" target="_blank" rel="noopener">
        <div class="obit-header">
          ${photoHtml}
          <div class="obit-info">
            <div class="obit-name">${name}</div>
            <div class="obit-meta">${metaParts.join(' · ')}</div>
          </div>
        </div>
      </a>
      ${detailSection}
      ${fullSection}
    </div>`;
  }

  function eventSortTime(service) {
    const d = parseDate(service?.StartTime);
    return d ? d.getTime() : Number.NEGATIVE_INFINITY;
  }

  function sortEventsDesc(services) {
    return [...services].sort((a, b) => eventSortTime(b) - eventSortTime(a));
  }

  function hasRecentPriorityEvent(meta, now) {
    return meta.priorityServices.some(svc => isRecent(parseDate(svc?.StartTime), now));
  }

  function sortTimeForObituary(obit, meta) {
    const priority = sortEventsDesc(meta.priorityServices);
    if (priority.length > 0) return eventSortTime(priority[0]);

    const source = sortEventsDesc(meta.sourceServices);
    if (source.length > 0) return eventSortTime(source[0]);

    const death = parseDate(obit.DeathDate);
    return death ? death.getTime() : Number.NEGATIVE_INFINITY;
  }

  function renderPanel(panelEl, bodyEl, badgeEl, obituaries, metaById, baseUrl, src) {
    const now = new Date();
    now.setHours(23, 59, 59, 999);

    const relevant = obituaries
      .filter(o => isWithinLookback(parseDate(o.DeathDate), now))
      .map(obit => {
        const meta = metaById.get(String(obit.Id)) || { services: [], cemetery: null, sourceServices: [], priorityServices: [] };
        return {
          obit,
          meta,
          highlight: hasRecentPriorityEvent(meta, now),
          sortTime: sortTimeForObituary(obit, meta),
        };
      })
      .sort((a, b) => b.sortTime - a.sortTime);

    const recentDeaths = relevant.filter(item => isRecent(parseDate(item.obit.DeathDate), now)).length;
    badgeEl.textContent = recentDeaths > 0
      ? `${recentDeaths} at this location`
      : '0 at this location';
    badgeEl.className = `summary-badge ${sourceTone(src)} ${recentDeaths > 0 ? 'alert' : 'clean'}`;

    if (relevant.length === 0) {
      bodyEl.innerHTML = '<div class="empty-state">No recent obituaries found.</div>';
      return;
    }

    const priority = relevant.filter(item => item.highlight);
    const older    = relevant.filter(item => !item.highlight);

    let html = '';
    if (priority.length > 0) {
      html += '<div class="week-section-label">Service / Visitation Here</div><div class="obit-list">';
      for (const item of priority) html += renderCard(item.obit, true, baseUrl);
      html += '</div>';
    }
    if (older.length > 0) {
      html += '<div class="older-section-label">Other Recent Obituaries</div><div class="obit-list">';
      for (const item of older) html += renderCard(item.obit, false, baseUrl);
      html += '</div>';
    }
    bodyEl.innerHTML = html;
    attachServiceDetails(bodyEl, src, metaById);
  }

  async function loadPanel(endpoint, panelEl, bodyEl, badgeEl, baseUrl, src) {
    try {
      const res  = await fetch(endpoint);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.Obituaries || data.obituaries || []);
      const lookbackList = list.filter(o => isWithinLookback(parseDate(o.DeathDate), new Date()));
      const metaEntries = await Promise.all(lookbackList.map(async obit => {
        const info = await getObituaryInfo(obit.Id, src);
        const meta = buildObituaryMeta(src, info);
        addServiceDates(src, meta.services);
        return [String(obit.Id), meta];
      }));
      const metaById = new Map(metaEntries);
      renderPanel(panelEl, bodyEl, badgeEl, list, metaById, baseUrl, src);
    } catch (err) {
      bodyEl.innerHTML = `<div class="error-state">Error: ${escHtml(err.message)}</div>`;
      badgeEl.textContent = 'Error';
      badgeEl.className = 'summary-badge loading';
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────

  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

  document.querySelectorAll('.panel-header').forEach(header => {
    header.addEventListener('click', e => {
      if (window.innerWidth > 640) return;
      if (e.target.closest('.panel-title-link')) return;
      header.closest('.panel').classList.toggle('expanded');
    });
  });

  loadPanel('/api/oakley-cook', document.querySelector('.oc-panel'), document.getElementById('oc-body'), document.getElementById('oc-badge'), 'https://www.oakley-cook.com/obituaries/', 'oakley-cook');
  loadPanel('/api/akard',       document.querySelector('.ak-panel'), document.getElementById('ak-body'), document.getElementById('ak-badge'), 'https://www.akardfuneralhome.com/obituaries/', 'akard');
  loadPanel('/api/oak-hill',    document.querySelector('.oh-panel'), document.getElementById('oh-body'), document.getElementById('oh-badge'), 'https://www.oakhillfh.com/obituaries/', 'oak-hill');
</script>
</body>
